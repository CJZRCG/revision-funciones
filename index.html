<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: asistente paso a paso con fondo crema fijo; una pantalla corta por tema, filas compactas con botones Sí / No, precios al final */
:root{
  --bg:#FBF4DF; --surface:#FFFDF6; --ink:#2A2118; --muted:#6B5F4E; --line:#E9DDBF; --ex:#F5EBCF;
  --accent:#1F4A7A; --accent-ink:#FFFFFF; --accent-soft:#E2E9F2;
  --ok:#1E7A4C; --ok-soft:#E6F2DF; --no:#B42A20; --no-soft:#F9E3DA;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;
  color-scheme:light;
}
/* Fondo por tipo de usuario */
body[data-sec="sal"]{--bg:#E4EDF2; --ex:#D3E1E9; --line:#C7D7E0}
body[data-sec="cli"]{--bg:#F9E4DA; --ex:#F1D2C3; --line:#E9C9B9}
*{box-sizing:border-box}
html{background:#FBF4DF}
body{background:var(--bg);transition:background-color .45s ease;min-height:100vh}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* Barra superior de avance */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;flex-direction:column;gap:8px}
.top-txt{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.top-txt b{color:var(--ink)}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
.screen{display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-0.015em;text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(1.9rem,7vw,2.5rem)}
h2{font-size:clamp(1.5rem,5.5vw,1.9rem)}
p{margin:0}
.muted{color:var(--muted)}
.tag{align-self:flex-start;font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}

/* Campos */
label{font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:64px;resize:vertical}

/* Botones */
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;min-height:52px;padding:0 26px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn-line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.yn:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Lista de pasos en la portada */
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.how li{display:flex;gap:12px;align-items:center}
.how .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.ic.s{background:var(--ok-soft);color:var(--ok)} .ic.n{background:var(--no-soft);color:var(--no)} .ic.t{background:var(--accent-soft);color:var(--accent)}

/* Etapas */
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stage{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stage.now{border:2px solid var(--accent)}
.stage .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--accent-soft);color:var(--accent)}
.stage.now .n{background:var(--accent);color:var(--accent-ink)}
.stage div{min-width:0;display:flex;flex-direction:column;gap:2px}
.stage b{font-size:1.02rem}

/* Filas de función */
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,background .15s}
.row.si{border-color:var(--ok);background:var(--ok-soft)}
.row.no{border-color:var(--no);background:var(--no-soft)}
.row-main{display:flex;flex-direction:column;gap:12px}
.row-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-txt b{font-size:1.02rem;line-height:1.3}
.ex{display:block;margin-top:6px;background:var(--ex);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:.93rem;line-height:1.4;color:var(--ink)}
.ex i{font-style:normal;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:1px}
.row.si .ex,.row.no .ex{background:var(--surface)}
.later{align-self:flex-start;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);margin-top:4px}
.yn-group{flex:none;display:flex;gap:8px}
.row .yn-group{align-self:stretch}
.fn{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.q{font-weight:600;font-size:.95rem;margin-bottom:-4px}
.row .yn{flex:1;width:auto;height:48px;flex-direction:row;gap:6px;font-size:.95rem}
.yn{font:inherit;width:56px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:.74rem;font-weight:700}
.yn svg{width:22px;height:22px}
.yn.s:hover{border-color:var(--ok);color:var(--ok)} .yn.n:hover{border-color:var(--no);color:var(--no)}
.yn.s[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.yn.n[aria-pressed=true]{background:var(--no);border-color:var(--no);color:#FFFFFF}
.link{font:inherit;font-size:.9rem;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;align-self:flex-start}

/* Planes */
.plans{display:flex;flex-direction:column;gap:12px}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.plan.si{border-color:var(--ok)} .plan.no{border-color:var(--no)}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.plan-head h3{margin:0;font-family:var(--display);font-size:1.3rem}
.price{font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted)}
.plan ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.plan .ask{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.plan .ask span{font-weight:600}

/* Tabla de planes */
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pc b{font-size:.95rem}
.pc span{font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.pc small{color:var(--muted);font-size:.78rem}
.tbl{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.cmp{width:100%;border-collapse:collapse;font-size:.88rem}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.cmp td.fname{text-align:left;padding-left:12px;font-weight:500;min-width:120px}
.cmp tr.sec th{background:var(--ex);font-size:.78rem;font-weight:700;color:var(--ink);text-align:center;white-space:nowrap}
.cmp tr.sec th:first-child{text-align:left;padding-left:12px;white-space:normal;font-size:.85rem}
.cmp td.yes,.legend .yes{color:var(--ok);font-weight:700;font-size:1.05rem}
.cmp td.off,.legend .off{color:#B8AC94}
.cmp td.txt{font-size:.78rem;line-height:1.25;color:var(--ink)}
.legend{font-size:.85rem;color:var(--muted)}
.ph{font-family:var(--display);font-size:1.25rem;margin:8px 0 0}

/* Resumen final */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.stat.s b{color:var(--ok)} .stat.n b{color:var(--no)}
.msg{font-weight:600}
.msg.err{color:var(--no)} .msg.ok{color:var(--ok)}
.summary{white-space:pre-wrap;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:240px;overflow:auto}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .btn{flex:1}
.nav .back{flex:none;background:none;border:0;font:inherit;font-weight:600;color:var(--muted);padding:0 10px;min-height:52px;cursor:pointer}
.nav .back[hidden]{display:none}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion: reduce){ .row,.track i{transition:none} }
</style>
</head>

<nav class="nav" aria-label="Navegación">

    <button class="back" id="back" type="button" hidden>Atrás</button>
    <button class="btn" id="next" type="button">Empezar</button>
  </div>
</nav>

 e_sugerir:["","✓","✓"], e_buscador:["✓","✓","✓"], e_primero:["","","✓"], e_qr:["✓","✓","✓"], e_visitas:["","Básico","Completo"],
 e_identidad:["✓","✓","✓"], e_vinculo:["✓","✓","✓"], e_trayectoria:["","✓","✓"], e_precios:["✓","✓","✓"],
 e_opiniones:["✓","✓","✓"], e_responder:["","✓","✓"], e_fotos:["Hasta 10","Ilimitado","Ilimitado"], e_cursos:["","✓","✓"], e_garantia:["✓","✓","✓"],
 e_agenda:["✓","✓","✓"], e_hoy:["✓","✓","✓"], e_espera:["","✓","✓"], e_recordatorios:["30 al mes","Ilimitados","Ilimitados"],
 e_ficha:["Últimas 3 visitas","Completa","Completa"], e_clientela:["✓","✓","✓"], e_siguen:["✓","✓","✓"], e_descarga:["✓","✓","✓"],
 e_cuentas:["Solo ingresos","Completo","Completo"], e_rentable:["","✓","✓"], e_contador:["","✓","✓"], e_avanzados:["","","✓"],
 e_tendencias:["Mensual","Semanal","Semanal + alertas"],
 e_tienda:["✓","✓","Con descuentos"], e_invitar:["✓","✓","✓"], e_credito:["✓","✓","✓"],
 s_perfil:["3 fotos","Galería","Galería"], s_confirmar:["✓","✓","✓"], s_equipo:["Lista simple","Destacado","Destacado"],
 s_opiniones:["Ver","Ver y responder","Ver y responder"], s_reserva:["","✓","✓"], s_estadisticas:["","✓","Por sede"],
 s_vacantes:["","1 al mes","Ilimitadas"], s_buscar:["","","✓"], s_primero:["","","✓"], s_sedes:["","","✓"], s_tienda:["","✓","Por volumen"]
};
const TIERS = {
 est:{t:"Planes del estilista", d:"Así quedan repartidas las 43 funciones que acabas de revisar. Todos los planes son mensuales.",
      plans:[{id:"p_presencia",n:"Presencia",price:"$30.000"},{id:"p_pro",n:"Pro",price:"$50.000"},{id:"p_elite",n:"Élite",price:"$70.000"}],
      groups:()=>GROUPS.filter(g=>g.sec==="Estilista")},
 sal:{t:"Planes del salón", d:"Así quedan repartidas las 11 funciones de los salones. El perfil básico no tiene costo.",
      plans:[{id:"p_basico",n:"Básico",price:"$0"},{id:"p_equipo",n:"Equipo",price:"$70.000"},{id:"p_red",n:"Red",price:"$140.000"}],
      groups:()=>GROUPS.filter(g=>g.sec==="Salón")}
};
const PLANS = TIERS.est.plans.concat(TIERS.sal.plans.filter(p=>p.id!=="p_basico"));

const RULES = {sec:"Reglas", t:"Las reglas del juego", d:"Dinos si te parecen justas.", items:[
  ["r_prueba","Prueba gratis de 3 días","Te registras el lunes y usas todo gratis hasta el miércoles.","1"],
  ["r_sin_gratis","Sin plan gratis para estilistas","Para tener página y agenda eliges Presencia, Pro o Élite.","1"],
  ["r_mensual","Pago mensual","Pagas tu plan una vez al mes, por adelantado.","1"],
  ["r_pausa","Si no pagas, tu cuenta se pausa","No pagaste: tu página queda en pausa. Pagas y todo vuelve igual.","1"],
  ["r_pagina","Tu página funciona con el plan activo","Si cancelas, tu página deja de recibir reservas.","1"],
  ["r_limite","Límite diario de consultas","En Pro tienes 10 consultas al día y al otro día se renuevan.","1"],
  ["r_web","Primero web, después app","Entras desde el navegador del celular, sin descargar nada.","1"],
  ["r_clientes","Clientes siempre gratis","Tus clientes reservan contigo sin pagar nada.","1"]
]};

/* Secuencia: portada, etapas, funciones, planes, reglas, envío */
const STEPS = [{k:"intro"},{k:"stages"}].concat(GROUPS.map(g=>({k:"group",g})), [{k:"tier",x:"est"},{k:"tier",x:"sal"},{k:"group",g:RULES},{k:"send"}]);
const ALL = [];
GROUPS.concat([RULES]).forEach(g=>g.items.forEach(([id,n,u,f])=>ALL.push({id,n,f,sec:g.sec})));
PLANS.forEach(p=>ALL.push({id:p.id,n:`Plan ${p.n} (${p.price})`,f:"1",sec:"Precios"}));

let S = {step:0, votos:{}, coment:{}, revisor:"", general:"", abiertos:{}};
try{ const raw = localStorage.getItem(STORE); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
const save = ()=>{ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} };
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const NO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';

function yn(id, name){
  const v = S.votos[id]||"";
  return `<div class="yn-group" role="group" aria-label="${esc(name)}">
    <button type="button" class="yn s" data-id="${id}" data-v="si" aria-pressed="${v==="si"}" aria-label="Sí, apruebo ${esc(name)}">${SI}Sí</button>
    <button type="button" class="yn n" data-id="${id}" data-v="no" aria-pressed="${v==="no"}" aria-label="No apruebo ${esc(name)}">${NO}No</button>
  </div>`;
}
function comment(id){
  const v = S.votos[id]||"", c = S.coment[id]||"";
  if(v==="no" || c || S.abiertos[id])
    return `<textarea id="c_${id}" data-c="${id}" aria-label="Comentario" placeholder="${v==="no"?"¿Qué cambiarías?":"Tu comentario"}">${esc(c)}</textarea>`;
  return `<button type="button" class="link" data-open="${id}">Comentar</button>`;
}

const R = {
 intro(){ return `<section class="screen">
   <span class="tag">Revisión de funciones</span>
   <h1>Ayúdanos a decidir qué tendrá la plataforma</h1>
   <p class="muted">Cada función viene con un ejemplo de cómo se vería. Tú decides si sirve.</p>
   <ul class="how">
     <li><span class="ic s">${SI.replace('aria-hidden="true"','aria-hidden="true" width="18" height="18"')}</span><span><b>Sí</b> si te parece útil.</span></li>
     <li><span class="ic n">${NO.replace('aria-hidden="true"','aria-hidden="true" width="18" height="18"')}</span><span><b>No</b> si la quitarías o cambiarías.</span></li>
     <li><span class="ic t">10'</span><span>Toma unos 10 minutos. Tu avance se guarda.</span></li>
   </ul>
 </section>`; },

 stages(){ return `<section class="screen">
   <span class="tag">Antes de empezar</span>
   <h2>Se construye por etapas</h2>
   <p class="muted">No todo llega el primer día. Algunas funciones dirán cuándo llegan.</p>
   <ol class="stages">
     <li class="stage now"><span class="n">1</span><div><b>Lanzamiento</b><span class="muted">Herramienta del estilista en la web, lista para usar en el celular.</span></div></li>
     <li class="stage"><span class="n">2</span><div><b>Llega después</b><span class="muted">Tienda de productos dentro de la plataforma.</span></div></li>
     <li class="stage"><span class="n">3</span><div><b>Más adelante</b><span class="muted">Entran los salones, crédito con un aliado y cursos.</span></div></li>
     <li class="stage"><span class="n">4</span><div><b>En el futuro</b><span class="muted">App para descargar y conectar tu propia IA.</span></div></li>
   </ol>
 </section>`; },

 group(g){ return `<section class="screen">
   <span class="tag">${esc(g.sec)}</span>
   <h2>${esc(g.t)}</h2>
   <p class="muted">${esc(g.d)}</p>
   <div class="list">${g.items.map(([id,n,u,f])=>`
     <div class="row ${S.votos[id]||""}" id="r_${id}">
       <div class="row-main">
         <div class="row-txt"><span class="fn">Función</span><b>${esc(n)}</b>${LATER[f]?`<span class="later">${LATER[f]}</span>`:""}<span class="ex"><i>Ejemplo</i>${esc(u)}</span></div>
         <span class="q">¿Te parece útil esta función?</span>
         ${yn(id,n)}
       </div>
       ${comment(id)}
     </div>`).join("")}
   </div>
 </section>`; },

 tier(x){ const T = TIERS[x];
   const cell = v=> !v ? `<td class="off" aria-label="No incluido">—</td>` : (v==="✓" ? `<td class="yes" aria-label="Incluido">✓</td>` : `<td class="txt">${esc(v)}</td>`);
   const head = name=>`<tr class="sec"><th scope="col">${esc(name)}</th>${T.plans.map(p=>`<th scope="col">${p.n}</th>`).join("")}</tr>`;
   return `<section class="screen">
   <span class="tag">Precios</span>
   <h2>${T.t}</h2>
   <p class="muted">${T.d}</p>
   <div class="prices">${T.plans.map(p=>`<div class="pc"><b>${p.n}</b><span>${p.price}</span><small>${p.price==="$0"?"sin costo":"al mes"}</small></div>`).join("")}</div>
   <div class="tbl"><table class="cmp">
     ${T.groups().map(g=>head(g.t)+g.items.map(([id,n])=>`<tr><td class="fname">${esc(n)}</td>${(PV[id]||["","",""]).map(cell).join("")}</tr>`).join("")).join("")}
   </table></div>
   <p class="legend"><span class="yes">✓</span> incluido · <span class="off">—</span> no incluido</p>
   <h3 class="ph">¿El precio de cada plan te parece justo?</h3>
   <div class="list">${T.plans.filter(p=>p.price!=="$0").map(p=>`
     <div class="row ${S.votos[p.id]||""}">
       <div class="row-main"><div class="row-txt"><span class="fn">Plan</span><b>${p.n} · ${p.price} al mes</b></div>${yn(p.id,"precio del plan "+p.n)}</div>
       ${comment(p.id)}
     </div>`).join("")}
   </div>
 </section>`; },

 send(){
   const t = ALL.length, si = ALL.filter(i=>S.votos[i.id]==="si").length, no = ALL.filter(i=>S.votos[i.id]==="no").length;
   const pend = ALL.filter(i=>!S.votos[i.id]);
   return `<section class="screen">
   <span class="tag">Último paso</span>
   <h2>Gracias por tu revisión</h2>
   <div class="stats">
     <div class="stat s"><b>${si}</b><span class="muted">Sí</span></div>
     <div class="stat n"><b>${no}</b><span class="muted">No</span></div>
     <div class="stat"><b>${t-si-no}</b><span class="muted">Sin revisar</span></div>
   </div>
   ${pend.length?`<p class="muted">Puedes volver con "Atrás" para revisar lo que falta, o enviar así.</p>`:""}
   <div class="field"><label for="general">¿Algo que falte o te preocupe? (opcional)</label><textarea id="general" placeholder="Escribe aquí">${esc(S.general)}</textarea></div>
   <p class="msg" id="sendMsg" role="status"></p>
 </section>`; }
};

function sectionLabel(st){
  if(st.k==="intro") return "Bienvenida";
  if(st.k==="stages") return "Etapas";
  if(st.k==="tier") return "Precios";
  if(st.k==="send") return "Enviar";
  return st.g.sec;
}

function render(){
  const st = STEPS[S.step];
  $("#view").innerHTML = st.k==="group" ? R.group(st.g) : (st.k==="tier" ? R.tier(st.x) : R[st.k]());
  document.body.dataset.sec = st.k==="group" ? ({"Salón":"sal","Cliente":"cli"}[st.g.sec]||"est") : (st.k==="tier" && st.x==="sal" ? "sal" : "est");
  $("#top").hidden = S.step===0;
  $("#topSec").textContent = sectionLabel(st);
  $("#topN").textContent = S.step; $("#topT").textContent = STEPS.length-1;
  $("#topBar").style.width = (S.step/(STEPS.length-1)*100)+"%";
  $("#back").hidden = S.step===0;
  const next = $("#next");
  next.disabled = false;
  next.textContent = S.step===0 ? "Empezar" : (st.k==="send" ? "Enviar revisión" : "Siguiente");
}
function go(n){ S.step = Math.max(0, Math.min(STEPS.length-1, n)); save(); render(); window.scrollTo({top:0}); }

function rerenderKeepScroll(focusSel){
  const y = window.scrollY; render(); window.scrollTo({top:y});
  if(focusSel){ const el = document.querySelector(focusSel); if(el) el.focus({preventScroll:true}); }
}

document.addEventListener("click", e=>{
  const b = e.target.closest(".yn");
  if(b){
    const id = b.dataset.id, v = b.dataset.v;
    if(S.votos[id]===v) delete S.votos[id]; else S.votos[id]=v;
    save();
    rerenderKeepScroll(S.votos[id]==="no" ? `#c_${id}` : `.yn[data-id="${id}"][data-v="${v}"]`);
    return;
  }
  const o = e.target.closest("[data-open]");
  if(o){ const id=o.dataset.open; S.abiertos[id]=true; rerenderKeepScroll(`#c_${id}`); return; }
});
document.addEventListener("input", e=>{
  const id = e.target.dataset && e.target.dataset.c;
  if(id){ S.coment[id] = e.target.value.slice(0,600); save(); }
  if(e.target.id==="revisor"){ S.revisor = e.target.value.slice(0,80); save(); }
  if(e.target.id==="general"){ S.general = e.target.value.slice(0,1500); save(); }
});

$("#back").addEventListener("click", ()=>go(S.step-1));
$("#next").addEventListener("click", ()=>{
  if(STEPS[S.step].k==="send") enviar(); else go(S.step+1);
});

async function enviar(){
  const msg = $("#sendMsg"), btn = $("#next");
  if(!Object.keys(S.votos).length){ msg.className="msg err"; msg.textContent="Marca al menos una función con Sí o No antes de enviar."; return; }
  const payload = {v:VERSION, hp:$("#website").value||"", fecha:new Date().toISOString(), general:(S.general||"").trim(),
    items: ALL.map(i=>({id:i.id, seccion:i.sec, funcion:i.n, etapa:LATER[i.f]||"Lanzamiento", voto:S.votos[i.id]||"", comentario:(S.coment[i.id]||"").trim()}))};
  if(!ENDPOINT){ msg.className="msg"; msg.textContent="Vista previa: esta copia aún no está conectada a la hoja de cálculo."; return; }
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    msg.className="msg ok"; msg.textContent="¡Listo! Tu revisión quedó registrada."; btn.textContent = "Enviado";
  }catch(e){
    msg.className="msg err"; msg.textContent="No se pudo enviar. Revisa tu conexión e inténtalo de nuevo."; btn.disabled=false; btn.textContent="Enviar revisión";
  }
}

if(S.step>=STEPS.length) S.step=0;
render();
</script>

</body>
</html>
